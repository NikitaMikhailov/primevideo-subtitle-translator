name = "pv-subtitle-translator"
main = "worker.js"
compatibility_date = "2024-11-01"

# The Google API key is NOT stored here. Set it as a secret:
#   npx wrangler secret put GOOGLE_API_KEY
#
# After deploy the worker URL looks like:
#   https://pv-subtitle-translator.<your-subdomain>.workers.dev
# Paste that URL into the extension options ("Translation server URL").
