<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime Video Subtitle Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Subtitle Translator</h1>

    <label class="row switch">
      <span>Enable translation</span>
      <input type="checkbox" id="enabled" />
    </label>

    <label class="row">
      <span>Translate to</span>
      <select id="target">
        <option value="en">English</option>
        <option value="ru">Russian</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="fr">French</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
        <option value="tr">Turkish</option>
        <option value="uk">Ukrainian</option>
        <option value="pl">Polish</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh-CN">Chinese (Simplified)</option>
      </select>
    </label>

    <label class="row switch">
      <span>Show original</span>
      <input type="checkbox" id="showOriginal" />
    </label>

    <label class="row">
      <span>Font size: <b id="fontSizeVal">28</b>px</span>
      <input type="range" id="fontSize" min="14" max="48" step="1" />
    </label>

    <button type="button" id="openOptions" class="link-row">
      Self-hosting &amp; advanced settings →
    </button>

    <p class="hint">
      First time? Open <b>Self-hosting &amp; advanced settings</b> to set up your
      translation server. Then play a video on primevideo.com with subtitles (CC)
      on. Toggle shortcut: Alt+Shift+S.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
